client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
	require_message_authenticator = no
	nas_type = other
}

client localhost_ipv6 {
	ipv6addr = ::1
	secret = testing123
}

# Permite chamadas vindas de qualquer container da rede Docker ou do host
client docker_network {
	ipaddr = 0.0.0.0/0
	secret = testing123
	require_message_authenticator = no
	nas_type = other
}
